services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: focus_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host 5432 often taken by other local stacks; map to 55432
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d focus_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/focus_analytics
    ports:
      # Host 8000 may be taken; map to 18000
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/focus_analytics
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 384m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_BITRIX_PORTAL_URL: ${BITRIX_PORTAL_URL:-}
    ports:
      - "13000:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m

volumes:
  pgdata:
