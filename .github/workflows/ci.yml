name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - stage2-analytics
      - stage25-sales-rules
      - stage26-visual-redesign
      - avito-phase1-probe
      - "stage*"
      - "avito*"

# No production deploy. No real secrets.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Safe placeholders only — tests default to in-memory SQLite via conftest
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      SESSION_SECRET: ci-test-session-secret-not-real
      DEMO_MODE: "false"
      BITRIX_WEBHOOK_URL: ""
      BITRIX_PORTAL_URL: ""
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      APP_TIMEZONE: Europe/Moscow
      # Default TIMEMAN_COLLECTOR_ENABLED=true — required by unit tests with mocks
      AVITO_ACCOUNT_1_NAME: ""
      AVITO_ACCOUNT_1_CLIENT_ID: ""
      AVITO_ACCOUNT_1_CLIENT_SECRET: ""
      AVITO_ACCOUNT_1_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_INTERNAL_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
